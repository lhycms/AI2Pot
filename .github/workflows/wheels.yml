# AI2Pot wheel 构建 CI（v1 草案，2026-09-02）
#
# 产物矩阵（版本带 PEP 440 local segment，见 outputs/wheel_publish_plan.md §4/§7.1）：
#   - Linux CPU   : 1.x.x+cpu   manylinux_2_28_x86_64, cp311/cp312  (cibuildwheel)
#   - Linux CUDA  : 1.x.x+cuda  linux_x86_64,            cp311/cp312  (裸机 + CUDA 12.4 toolkit)
#   - macOS CPU   : 1.x.x+cpu   macosx arm64/x86_64,     cp311/cp312  (cibuildwheel + brew libomp)
#
# 已知前提 / 待跑通后迭代的点：
#   - torch==2.5.0 为 ABI 基线（与 README 一致）；CPU 链接只依赖 libtorch_cpu/libc10，
#     因此 repair 时必须 exclude torch 库（运行时由先 `import torch` 提供同名 SONAME）。
#   - 发版（PyPI 上传）另建 publish job，先用 trusted publishing，这里只出 wheel 产物。
#   - macOS x86_64 用的是 macos-13（Intel）runner；若官方下线需改用 Rosetta/CIBW_ARCHS。

name: wheels

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_VERSION: "2.5.0"
  NUMPY_VERSION: "2.4.6"

jobs:
  # ============================================================
  # 1. Linux CPU wheel（manylinux_2_28_x86_64, +cpu）
  # ============================================================
  linux-cpu:
    name: linux-cpu (cp311/cp312)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (cibuildwheel driver)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      # 构建期 python 版本与 wheel 元数据一致地带上 +cpu local segment
      - name: Append +cpu local version
        run: |
          BASE=$(python3 -c "import re;print(re.search(r'version = \"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          sed -i.bak "s/^version = .*/version = \"${BASE}+cpu\"/" pyproject.toml
          sed -i.bak "s/__version__ = .*/__version__ = \"${BASE}+cpu\"/" ai2pot/__init__.py
          rm -f pyproject.toml.bak ai2pot/__init__.py.bak

      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          # numpy 2.4.6 需要 glibc>=2.28（且与 torch 2.5 的 manylinux2014 兼容）
          # CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          # 容器内先装构建依赖 + CPU 版 torch；--no-build-isolation 保证用容器环境里的 torch 头
          CIBW_BEFORE_BUILD_LINUX: "python -m pip install numpy==2.4.6 pybind11==2.11.1 scikit-build-core==0.12.2 cmake==4.3.2 && python -m pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu"
          # 覆盖 pyproject 里硬编码的 USE_CUDA=yes / BUILD_TEST=yes
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation --config-setting=cmake.define.USE_CUDA=off --config-setting=cmake.define.BUILD_TEST=off"
          # torch 是运行时依赖，不能被打进 wheel（auditwheel 默认会 bundle 非白名单 .so）
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: 'auditwheel repair --exclude libtorch_cpu.so --exclude libc10.so -w {dest_dir} {wheel}'
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Smoke test (cp312 wheel, CPU torch)
        run: |
          WHEEL=$(ls wheelhouse/*cp312*.whl | head -1)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q torch==$TORCH_VERSION --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install -q numpy==$NUMPY_VERSION
          /tmp/smoke/bin/pip install -q --no-deps "$WHEEL"
          /tmp/smoke/bin/python -c "from ai2pot import fromcc; import torch; assert 'mtpr' in dir(torch.ops) and 'nep' in dir(torch.ops); print('SMOKE OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cpu
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ============================================================
  # 2. Linux CUDA wheel（linux_x86_64, +cuda）
  # ============================================================
  linux-cuda:
    name: linux-cuda (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install CUDA 12.4 toolkit (nvcc)
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "12.4.1"

      - name: Append +cuda local version
        run: |
          BASE=$(python3 -c "import re;print(re.search(r'version = \"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          sed -i.bak "s/^version = .*/version = \"${BASE}+cuda\"/" pyproject.toml
          sed -i.bak "s/__version__ = .*/__version__ = \"${BASE}+cuda\"/" ai2pot/__init__.py
          rm -f pyproject.toml.bak ai2pot/__init__.py.bak

      - name: Install torch (cu124) and build deps
        run: |
          python -m pip install torch==$TORCH_VERSION --index-url https://download.pytorch.org/whl/cu124
          python -m pip install numpy==$NUMPY_VERSION pybind11==2.11.1 scikit-build-core==0.12.2 cmake==4.3.2

      # 有 CUDA toolkit -> source/CMakeLists.txt 自动出 CUDA 构建；产物是 linux_x86_64 tag
      - name: Build wheel
        run: |
          python -m pip wheel --no-build-isolation --no-deps . \
            --config-setting=cmake.define.BUILD_TEST=off \
            -w wheelhouse

      - name: Smoke test (CPU torch 即可验证 CPU 算子加载，GPU 实机验证留发布前)
        run: |
          WHEEL=$(ls wheelhouse/*.whl | head -1)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q torch==$TORCH_VERSION --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install -q numpy==$NUMPY_VERSION
          /tmp/smoke/bin/pip install -q --no-deps "$WHEEL"
          /tmp/smoke/bin/python -c "from ai2pot import fromcc; import torch; assert 'mtpr' in dir(torch.ops) and 'nep' in dir(torch.ops); print('SMOKE OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cuda-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ============================================================
  # 3. macOS CPU wheel（arm64 / x86_64, +cpu）
  # ============================================================
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14     # Apple Silicon
            arch: arm64
            libomp: /opt/homebrew/opt/libomp
          - os: macos-13     # Intel（官方下线后改用 Rosetta + CIBW_ARCHS）
            arch: x86_64
            libomp: /usr/local/opt/libomp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (cibuildwheel driver)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libomp (OpenMP runtime, macOS 无系统版)
        run: brew install libomp

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Append +cpu local version
        run: |
          BASE=$(python3 -c "import re;print(re.search(r'version = \"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          sed -i.bak "s/^version = .*/version = \"${BASE}+cpu\"/" pyproject.toml
          sed -i.bak "s/__version__ = .*/__version__ = \"${BASE}+cpu\"/" ai2pot/__init__.py
          rm -f pyproject.toml.bak ai2pot/__init__.py.bak

      - name: Build wheels
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          CIBW_BEFORE_BUILD_MACOS: "python -m pip install numpy==$NUMPY_VERSION pybind11==2.11.1 scikit-build-core==0.12.2 cmake==4.3.2 && python -m pip install torch==$TORCH_VERSION"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation --config-setting=cmake.define.USE_CUDA=off --config-setting=cmake.define.BUILD_TEST=off"
          # find_package(OpenMP) 需要看到 brew libomp；delocate 修 libomp 进 wheel、exclude torch 库
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0 CMAKE_PREFIX_PATH=${{ matrix.libomp }}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: 'if delocate-wheel --help | grep -q -- "--exclude"; then delocate-wheel -w {dest_dir} -e libtorch_cpu.dylib -e libc10.dylib {wheel}; else delocate-wheel -w {dest_dir} {wheel}; fi'
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Smoke test (host venv, CPU torch)
        run: |
          WHEEL=$(ls wheelhouse/*${{ matrix.arch }}*.whl | head -1)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q torch==$TORCH_VERSION
          /tmp/smoke/bin/pip install -q numpy==$NUMPY_VERSION
          /tmp/smoke/bin/pip install -q --no-deps "$WHEEL"
          /tmp/smoke/bin/python -c "from ai2pot import fromcc; import torch; assert 'mtpr' in dir(torch.ops) and 'nep' in dir(torch.ops); print('SMOKE OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
